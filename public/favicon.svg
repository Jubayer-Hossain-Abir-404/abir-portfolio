<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A">
  <!--
    Monogram mark. Drawn as geometry rather than set as text on purpose: an SVG
    favicon is rendered without the page's fonts, so a <text> element falls back
    to whatever the OS supplies and the mark changes shape per machine.

    The tile is the signal accent rather than a theme colour, so the same file
    holds up against both a light and a dark browser chrome and needs no
    prefers-color-scheme block. The 2px radius matches the editorial radius
    token. (No double hyphens in here: this file is parsed as XML.)
  -->
  <rect width="32" height="32" rx="2" fill="#b9481a" />
  <g fill="none" stroke="#fafaf8" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M6.5 25 L16 7.5 L25.5 25" stroke-width="3.8" />
    <path d="M10.2 19.5 H21.8" stroke-width="3.2" />
  </g>
</svg>
